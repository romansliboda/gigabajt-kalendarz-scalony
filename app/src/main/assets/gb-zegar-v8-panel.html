<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gigabajt — test menu zegara</title><style>*{box-sizing:border-box}body{margin:0;background:#e8edf3;color:#182b42;font-family:Arial,sans-serif}.header{background:#12375b;color:white;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:20px}.brand small{display:block;font-size:12px;font-weight:400}.headclock{display:flex;align-items:center;gap:8px}.wrap{max-width:560px;margin:auto}.ban{background:#dbe9dd;color:#23623b;padding:12px;margin:10px;border-radius:12px;text-align:center}.panel{background:#fff;margin:12px 10px;padding:16px;border-radius:15px;box-shadow:0 2px 10px #0001}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#f0f5fa;border:1px solid #cad6e1;border-radius:12px;min-height:104px;font-size:16px;font-weight:bold;cursor:pointer}.tile span{display:block;font-size:28px;margin-bottom:8px}.back{background:#205b91;color:white;border:0;border-radius:9px;width:100%;padding:13px;margin-top:15px}.calendarhead{text-align:center;font-weight:bold;margin:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{text-align:center;padding:8px 0;border:1px solid #e0e7ee;border-radius:5px;font-size:12px}.day.top{font-weight:bold;background:#f2f5f8}.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:9999}.overlay.open{display:flex}.modal{background:#fff;width:min(100%,440px);max-height:90dvh;overflow-y:auto;border-radius:15px;padding:18px;box-shadow:0 18px 70px #0007}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.modalhead h2{font-size:19px;margin:0}.x{border:0;background:#eef2f6;border-radius:7px;font-size:24px;width:36px;height:36px;cursor:pointer}.options{display:grid;grid-template-columns:1fr 1fr;gap:10 </style><style id="gb-v8-frame-only">body{background:#fff!important}.header,.ban,#calendarPanel{display:none!important}#settingsPanel{margin:0!important;box-shadow:none!important;border-radius:0!important;padding:12px!important}.outer-save{display:none!important}.wrap{max-width:100%!important}</style></head><body><div class="wrap"><header class="header"><div class="brand">🚛 GB <small>Kalendarz rozliczeń</small></div><div class="headclock" id="headclock"></div><button class="header-settings" onclick="reopenSettings()" aria-label="Otwórz ustawienia">⚙️</button></header><div class="ban">🚚 Zakazy jazdy — podgląd</div><section class="panel" id="settingsPanel"><h3>Ustawienia aplikacji</h3><div class="tiles"><button class="tile" onclick="openClock()"><span>🕒</span>Zegar</button><button class="tile" onclick="openGeneral()"><span>⚙️</span>Ustawienia</button></div><div class="status" id="status"></div><button class="btn primary outer-save" onclick="saveAndCloseSettings()">Zapisz i zamknij</button></section><section class="panel" id="calendarPanel"><div class="calendarhead">◀　Październik 2026　▶</div><div class="calendar" id="calendar"></div></section></div><div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle"><div class="modalhead"><h2 id="mtitle"></h2><button class="x" onclick="closeModal()">×</button></div><div id="content"></div></div></div><script>
const names=['Pn','Wt','Śr','Cz','Pt','So','Nd'];document.getElementById('calendar').innerHTML=names.map(x=>'<div class="day top">'+x+'</div>').join('')+'<div class="day"></div>'.repeat(3)+Array.from({length:31},(_,i)=>'<div class="day">'+(i+1)+'</div>').join('');
const palette=[['Zielona','#287D4A'],['Żółta','#E9BD36'],['Pomarańczowa','#DA7D28'],['Brązowa','#80533B'],['Granatowa','#193B72'],['Czarna','#26272C'],['Bordowa','#87384B'],['Biała','#E8E9EC']];const digitalStyles=['Klasyczny','Pogrubiony','Sportowy','Techniczny','Elegancki'];const analogStyles=['Klasyczny','Minimalistyczny','Sportowy','Elegancki'];let settings={kind:'digital',style:'Klasyczny',color:'#287D4A',seconds:true,numbers:true,size:'Średni',auto:true,showTime:true,showDate:true,manualDate:new Date().toLocaleDateString('sv-SE'),manualTime:new Date().toTimeString().slice(0,5)},draft={},page='';function saveAndCloseSettings(){saveStorage();document.getElementById("settingsPanel").style.display="none";document.getElementById("calendarPanel").scrollIntoView({behavior:"smooth",block:"start"})}function reopenSettings(){document.getElementById("settingsPanel").style.display="block";document.getElementById("settingsPanel").scrollIntoView({behavior:"smooth",block:"start"})}function saveStorage(){try{localStorage.setItem('gb-test-clock',JSON.stringify(settings))}catch(e){}}try{settings={...settings,...JSON.parse(localStorage.getItem('gb-test-clock')||'{}')}}catch(e){}function show(pageName){page=pageName;document.getElementById('overlay').classList.add('open');document.body.style.overflow='hidden';render()}function closeModal(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow='';page=''}function openClock(){draft={...settings};show('choose')}function openGeneral(){draft={...settings};if(!draft.manualDate)draft.manualDate=new Date().toLocaleDateString('sv-SE');if(!draft.manualTime)draft.manualTime=new Date().toTimeString().slice(0,5);show('general')}function setDraft(k,v){const m=document.querySelector('.modal');const y=m.scrollTop;draft[k]=v;render();m.scrollTop=y}function pickKind(k){draft.kind=k;draft.style='Klasyczny';show('styles')}function pickStyle(s){draft.style=s;if(draft.kind==='analog'){show('details')}else{render()}}function commit(){if(page==='general'&&!draft.auto&&(!/^\d{4}-\d{2}-\d{2}$/.test(draft.manualDate)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(draft.manualTime)||Number.isNaN(new Date(draft.manualDate+'T'+draft.manualTime+':00').getTime()))){alert('Ustaw poprawną datę i godzinę.');return;}settings={...draft};saveStorage();closeModal();updateClock();document.getElementById('status').textContent='✓ Zapisano ustawienia zegara'}function opt(label,fn,preview=''){return '<button class="opt" onclick="'+fn+'">'+(preview?'<strong>'+preview+'</strong>':'')+label+'</button>'}function sampleDial(s,px){const light=['#E9BD36','#E8E9EC'].includes(s.color),ink=light?'#182536':'#fff';let labels='';for(let n=1;n<=12;n++){let a=n*Math.PI/6,x=50+38*Math.sin(a),y=50-38*Math.cos(a);if(s.style==='Minimalistyczny'||!s.numbers){labels+='<span class="num" style="left:'+x+'%;top:'+y+'%;color:'+ink+'">•</span>'}else{labels+='<span class="num" style="left:'+x+'%;top:'+y+'%;color:'+ink+';font-size:'+(s.style==='Sportowy'?'1.3em':'1em')+'">'+n+'</span>'}}let thick=s.style==='Sportowy'?1.6:s.style==='Elegancki'?.75:1;return '<div class="dial" style="width:'+px+'px;height:'+px+'px;background:'+s.color+';font-size:'+(px/13)+'px;border-width:'+(s.style==='Sportowy'?5:3)+'px">'+labels+'<div class="hand hour" style="background:'+ink+';height:25%;width:'+(5*thick)+'%;margin-left:-'+(2.5*thick)+'%;margin-top:-25%;transform:rotate(55deg)"></div><div class="hand minute" style="background:'+ink+';height:35%;width:'+(3*thick)+'%;margin-left:-'+(1.5*thick)+'%;margin-top:-35%;transform:rotate(145deg)"></div>'+(s.seconds?'<div class="hand second" style="height:40%;margin-top:-40%"></div>':'')+'<div class="dot"></div></div>'}
function sampleDigital(s){let font=s.style==='Techniczny'?'monospace':s.style==='Elegancki'?'Georgia,serif':'Arial,sans-serif';return '<div style="font-size:32px;font-family:'+font+';font-weight:'+(s.style==='Pogrubiony'||s.style==='Sportowy'?'900':'400')+';font-style:'+(s.style==='Sportowy'?'italic':'normal')+'">13:58</div>'}

function render(){const title={choose:'Wybierz zegar',styles:'Wybierz styl zegara',details:'Ustawienia wybranego zegara',general:'Data i godzina'};document.getElementById('mtitle').textContent=title[page];let h='';

'<button class="opt" onclick="pickKind(\'analog\')">'+sampleDial({...draft,kind:'analog'},80)+'<b>Analogowy</b></button></div>'}
else if(page==='styles'){let arr=draft.kind==='digital'?digitalStyles:analogStyles;h='<p>Wybierz styl na podstawie dużego podglądu:</p><div class="options">'+arr.map(s=>'<button class="opt '+(draft.style===s?'selected':'')+'" onclick="pickStyle(\''+s+'\')">'+(draft.kind==='analog'?sampleDial({...draft,style:s},56):sampleDigital({style:s}))+'<b>'+s+'</b></button>').join('')+'</div>'+(draft.kind==='digital'?'<div class="row"><button class="btn primary" onclick="commit()">Zapisz i zamknij</button></div>':'')}
else if(page==='details'){h=preview(draft);
if(draft.kind==='analog'){h+='<div class="label">Kolor tarczy — dotknij, aby zobaczyć zmianę powyżej</div><div class="swatches">'+palette.map(([n,c])=>'<button class="swatch '+(draft.color===c?'selected':'')+'" onclick="setDraft(\'color\',\''+c+'\')"><i style="background:'+c+'"></i>'+n+'</button>').join('')+'</div><div class="checks"><label><input type="checkbox" '+(draft.numbers?'checked':'')+' onchange="setDraft(\'numbers\',this.checked)">Cyfry godzin 1–12 (lub kreski/kropki)</label><label><input type="checkbox" '+(draft.seconds?'checked':'')+' onchange="setDraft(\'seconds\',this.checked)">Wskazówka sekundowa</label></div>'}

if(!draft.auto){h+='<div class="manual-fields"><strong>Ręczne ustawianie daty i godziny</strong><div class="manual-grid"><label>Data<input type="date" value="'+draft.manualDate+'" onchange="draft.manualDate=this.value"></label><label>Godzina<input type="time" value="'+draft.manualTime+'" onchange="draft.manualTime=this.value"></label></div><p>Wartości zostaną zapisane po naciśnięciu przycisku poniżej.</p></div>'}
h+='<div class="checks"><label><input type="checkbox" '+(draft.showTime?'checked':'')+' onchange="setDraft(\'showTime\',this.checked)">Pokazuj godzinę</label><label><input type="checkbox" '+(draft.showDate?'checked':'')+' onchange="setDraft(\'showDate\',this.checked)">Pokazuj datę</label></div><div class="row"><button class="btn primary" onclick="commit()">Zapisz i zamknij</button></div>'}

document.getElementById('content').innerHTML=h}
function makeDial(s){const light=['#E9BD36','#E8E9EC'].includes(s.color),ink=light?'#182536':'#fff';let labels='';for(let n=1;n<=12;n++){let angle=n*Math.PI/6;let x=50+37*Math.sin(angle),y=50-37*Math.cos(angle);labels+=s.numbers?'<span class="num" style="left:'+x+'%;top:'+y+'%;color:'+ink+'">'+n+'</span>':'<span class="num" style="left:'+x+'%;top:'+y+'%;color:'+ink+'">•</span>'}let px=60;return '<div class="dial" style="width:'+px+'px;height:'+px+'px;background:'+s.color+';font-size:10px">'+labels+'<div class="hand hour" style="background:'+ink+'"></div><div class="hand minute" style="background:'+ink+'"></div>'+(s.seconds?'<div class="hand second"></div>':'')+'<div class="dot"></div></div>'}function updateClock(){let s=settings;let clock=document.getElementById('headclock');let font=s.style==='Techniczny'?'monospace':s.style==='Elegancki'?'Georgia,serif':'Arial,sans-serif';let weight=s.style==='Pogrubiony'||s.style==='Sportowy'?'900':'400';let size=19;clock.innerHTML=(s.showTime?(s.kind==='analog'?makeDial(s):'<span style="font-size:'+size+'px;font-family:'+font+';font-weight:'+weight+';font-style:'+(s.style==='Sportowy'?'italic':'normal')+'">'+(s.auto?new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}):(s.manualTime||'13:58'))+'</span>'):'')+(s.showDate?'<small style="font-size:10px">'+(s.auto?new Date().toLocaleDateString('pl-PL'):(s.manualDate||'2026-10-22').split('-').reverse().join('.'))+'</small>':'')}updateClock();setInterval(()=>{if(settings.kind==='digital')updateClock()},30000);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});</script><script>
